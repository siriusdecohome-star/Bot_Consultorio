<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingreso al panel</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/panel/panel.css" />
  <style>
    .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login form { width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; }
    .login label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; }
    .login input { background: #0c2219; border: 1px solid var(--line); border-radius: 10px; color: var(--text); padding: 10px 12px; outline: 0; }
    .login input:focus { border-color: var(--accent); }
    .login .err { color: #ffb3b3; font-size: 13px; min-height: 18px; margin: 0; }
    .login h1 { display: flex; align-items: center; gap: 10px; }
    .login .note { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  </style>
</head>
<body>
  <div class="login">
    <form class="card" method="post" action="/panel/login">
      <h1><span class="dot"></span> Panel del consultorio</h1>
      <p class="note">Acceso para el equipo del consultorio (admin o recepción). Demo con datos ficticios.</p>
      <label>Correo <input name="email" type="email" autocomplete="username" placeholder="recepcion@sonrisaclara.demo.test" required /></label>
      <label>Contraseña <input name="password" type="password" autocomplete="current-password" required /></label>
      <p class="err" id="err"></p>
      <button class="btn" type="submit">Ingresar</button>
    </form>
  </div>
  <script>
    const e = new URLSearchParams(location.search).get("error");
    if (e) document.getElementById("err").textContent =
      e === "intentos" ? "Demasiados intentos. Espere unos minutos." : "Correo o contraseña incorrectos.";
  </script>
</body>
</html>
