<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Asistente de WhatsApp para agendar citas · Demo</title>
  <meta name="description" content="Probá el asistente de WhatsApp con IA que responde consultas y agenda citas, con el panel de tu equipo." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2325D366'/%3E%3Cpath fill='white' d='M18 16h28v6H18zm0 13h28v6H18zm0 13h18v6H18z'/%3E%3C/svg%3E" />
  <style>
    :root { --bg: #07130e; --panel: #10281e; --line: #1f3d30; --text: #e8f3ec; --muted: #8fb3a1; --accent: #25d366; --lime: #c8f25a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1000px 600px at 15% -10%, #12402c 0%, transparent 60%), var(--bg); display: grid; place-items: center; padding: 24px 16px; }
    main { max-width: 760px; width: 100%; }
    .tag { display: inline-block; color: var(--lime); font-size: 13px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
    h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.12; margin: 10px 0 14px; }
    p.lead { color: #cfe3d7; font-size: 17px; line-height: 1.55; margin: 0 0 22px; }
    ul { list-style: none; padding: 0; margin: 0 0 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    @media (max-width: 560px) { ul { grid-template-columns: minmax(0, 1fr); } }
    li { background: linear-gradient(180deg, var(--panel), #0d2119); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; line-height: 1.45; }
    li b { display: block; margin-bottom: 2px; }
    .cta { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    button { background: var(--accent); color: #04301a; border: 0; border-radius: 12px; padding: 14px 22px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    button:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
    .note { color: var(--muted); font-size: 14px; }
    .clarify { margin-top: 22px; border-left: 3px solid var(--lime); padding: 8px 14px; color: #dfeee5; background: #0d2119; border-radius: 0 10px 10px 0; font-size: 15px; }
    .error { color: #ffb3b3; margin-top: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Demo en vivo · 3 minutos</span>
    <h1>Un asistente de WhatsApp que responde y agenda citas por vos</h1>
    <p class="lead">Para cualquier negocio que trabaja con turnos. Probalo como paciente de una clínica de ejemplo y miralo desde el panel de tu equipo: un recorrido te guía paso a paso.</p>
    <div class="cta">
      <button type="button" id="go">Empezar la demo</button>
      <span class="note" id="hours">Tu copia es privada y se borra en 24 horas.</span>
    </div>
    <p class="error" id="err" role="alert"></p>
  </main>
  <script>
    const go = document.getElementById("go");
    fetch("/api/demo/status").then((r) => r.json()).then((s) => {
      if (!s.enabled) { go.disabled = true; document.getElementById("err").textContent = "La demo pública no está disponible en este momento."; }
      else document.getElementById("hours").textContent = `Tu copia es privada y se borra en ${s.hours} horas.`;
    }).catch(() => {});
    go.addEventListener("click", async () => {
      go.disabled = true;
      go.textContent = "Preparando tu clínica…";
      document.getElementById("err").textContent = "";
      try {
        const r = await fetch("/api/demo/start", { method: "POST" });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || "No se pudo abrir la demo");
        // El recorrido guiado (panel y chat del paciente comparten este estado).
        try { localStorage.setItem("recorrido", JSON.stringify({ step: "welcome", clinic: d.clinicId })); } catch {}
        location.href = d.panel;
      } catch (e) {
        document.getElementById("err").textContent = e.message;
        go.disabled = false;
        go.textContent = "Empezar la demo";
      }
    });
  </script>
</body>
</html>
